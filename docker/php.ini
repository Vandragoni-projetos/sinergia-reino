[PHP]
; Timezone
date.timezone = America/Sao_Paulo

; Upload
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Error handling (desabilitar em produção)
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Session
session.cookie_httponly = 1
session.use_strict_mode = 1
