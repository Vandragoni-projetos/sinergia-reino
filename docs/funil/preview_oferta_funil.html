<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview – Oferta especial para você</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .funnel-card { box-shadow: 0 25px 50px -12px rgba(0,0,0,.15); }
        .btn-primary:hover { filter: brightness(1.05); }
        .btn-secondary:hover { background-color: #e5e7eb; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">
    <p class="text-xs text-slate-500 mb-2 max-w-md text-center">Preview — assim o cliente vê a tela de oferta (upsell/downsell)</p>
    <div class="w-full max-w-md mx-auto">
        <div class="bg-white rounded-2xl funnel-card overflow-hidden border border-slate-200/80">
            <!-- Opcional: banner cabeçalho (se configurado) -->
            <!-- <div class="w-full"><img src="..." alt="" class="w-full object-cover object-top" style="max-height: 180px;"></div> -->
            <div class="px-6 py-5 bg-gradient-to-r from-indigo-600 to-indigo-700 text-white text-center">
                <p class="text-indigo-100 text-sm font-medium uppercase tracking-wider">Oferta especial</p>
                <h1 class="text-xl sm:text-2xl font-bold mt-1 leading-tight">Quer levar isso também?</h1>
            </div>
            <div class="p-6 sm:p-8">
                <div class="flex gap-5 items-start">
                    <!-- Capa do produto (ou capa personalizada se configurada) -->
                    <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-xl flex-shrink-0 ring-2 ring-slate-100 bg-indigo-100 flex items-center justify-center text-indigo-400 text-2xl">📦</div>
                    <div class="flex-1 min-w-0">
                        <h2 class="font-bold text-slate-900 text-lg leading-snug">Curso CriADS</h2>
                        <p class="text-2xl font-bold text-indigo-600 mt-2">R$ 1,50</p>
                    </div>
                </div>
                <p class="text-slate-600 text-sm mt-5 leading-relaxed">
                    Esta oferta é apresentada logo após sua compra. Aproveite!
                </p>
                <div class="mt-2 flex items-center gap-2 text-slate-500 text-xs">
                    <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                    <span>Compra 100% segura</span>
                </div>
                <div class="mt-8 flex flex-col gap-3">
                    <a href="#" class="btn-primary w-full inline-flex justify-center items-center px-6 py-4 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-500/25">
                        Sim, quero aproveitar — R$ 1,50
                    </a>
                    <a href="#" class="btn-secondary w-full inline-flex justify-center items-center px-6 py-3.5 text-slate-600 font-medium rounded-xl border border-slate-200 bg-slate-50 transition">
                        Não, obrigado
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
